# =============================================================================
#  Metin2 mt2009 (martysama0134 r41023) -- the server stack.
#
#      docker compose up -d
#
#  The same shape as linux-port/docker/docker-compose.yml: MariaDB, and every
#  game core in one supervised container. Same ports, same volume names, same
#  environment variables, so a .env written for the r40250 stack drives this
#  one unchanged. The panels, the ItemShop and the playerbot seed join as the
#  migration reaches them.
# =============================================================================

name: "${M2_COMPOSE_PROJECT_NAME:-metin2}"

services:

  mariadb:
    # 11.8 and not 10.11: the package's dumps were made by 11.8 and three of
    # their tables use utf8mb3_uca1400_ai_ci, a collation older servers refuse.
    image: mariadb:11.8
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-db"
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      MARIADB_ROOT_PASSWORD: "${M2_DB_ROOT_PASSWORD:?set M2_DB_ROOT_PASSWORD in .env}"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_KEEP_DEMO_ACCOUNTS: "${M2_KEEP_DEMO_ACCOUNTS:-1}"
      TZ: "${M2_TZ:-UTC}"

    volumes:
      - db-data:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
      - ./mariadb/initdb.d:/docker-entrypoint-initdb.d:ro
      # initdb runs gm_characters.sql from here, the same file apply.sh
      # runs on every start; one copy, two readers.
      - ./mariadb/playerbot:/opt/playerbot:ro

    ports:
      - "127.0.0.1:${M2_DB_PUBLISH_PORT:-3306}:3306"
    expose:
      - "3306"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

    networks: [backend]

  # ---------------------------------------------------------------------------
  # One-shot, additive Playerbot seed (rendered for this schema by
  # port/seedify.py; the migrator by port/migratorify.py). Runs on every start,
  # never rewrites an existing bot's progress.
  # ---------------------------------------------------------------------------
  playerbot-migrate:
    image: mariadb:11.8
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-playerbot-migrate"
    restart: "no"

    depends_on:
      mariadb:
        condition: service_healthy

    environment:
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_DB_ROOT_PASSWORD: "${M2_DB_ROOT_PASSWORD:-}"
      PLAYERBOT_SEED_STRICT: "${PLAYERBOT_SEED_STRICT:-0}"
      PLAYERBOT_EXPECT_MIN_EXISTING_BOTS: "${PLAYERBOT_EXPECT_MIN_EXISTING_BOTS:-0}"
      M2_PLAYERBOT_KINGDOMS: "${M2_PLAYERBOT_KINGDOMS:-1}"
      M2_PLAYERBOT_HUMAN_NAMES: "${M2_PLAYERBOT_HUMAN_NAMES:-1}"
      # The world's difficulty: apply.sh turns it into the event flags the
      # Biologist and the stable keeper read (quest/m2_difficulty.lua).
      M2_DIFFICULTY: "${M2_DIFFICULTY:-easy}"
      M2_BIOLOGIST_WAIT_HOURS: "${M2_BIOLOGIST_WAIT_HOURS:-0}"
      M2_HORSE_WAIT_HOURS: "${M2_HORSE_WAIT_HOURS:-0}"
      # The waits between two skill books, players' and bots' (custom only;
      # the presets carry their own).
      M2_BOOK_WAIT_HOURS: "${M2_BOOK_WAIT_HOURS:-0}"
      M2_BOT_BOOK_WAIT_HOURS: "${M2_BOT_BOOK_WAIT_HOURS:-0}"
      # The rates a fresh world starts on, as event flags written before
      # the cores come up (apply.sh). A world that has been set from the
      # panel keeps what the panel said; these reach only a world whose
      # flags do not exist yet.
      M2_RATE_EXP: "${M2_RATE_EXP:-100}"
      M2_RATE_DROP: "${M2_RATE_DROP:-100}"
      M2_RATE_YANG: "${M2_RATE_YANG:-100}"
      M2_PLAYERBOT_START_HELD: "${M2_PLAYERBOT_START_HELD:-0}"
      # Whether a player's new character gets the apprentice chest (the
      # launcher asks with the rates; starter_chest.quest reads the flag).
      M2_STARTER_CHEST: "${M2_STARTER_CHEST:-1}"
      # Whether the world is played with Auto Lowy and with the companion
      # (the launcher's difficulty window; the migrator writes the flags).
      M2_AUTOHUNT: "${M2_AUTOHUNT:-1}"
      M2_SIDEKICK: "${M2_SIDEKICK:-1}"

    entrypoint: ["/bin/sh", "/opt/playerbot/apply.sh"]

    volumes:
      - ./mariadb/playerbot:/opt/playerbot:ro
      # The spool, for one file: whether a world about to be made keeps its
      # bots at the door until the operator lets them in. The migrator is the
      # only step that runs before the cores and knows the world is fresh.
      - rates-spool:/opt/m2spool

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    networks: [backend]

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: "${M2_BASE_IMAGE:-ubuntu:24.04}"
        MAKE_JOBS: "${M2_MAKE_JOBS:-}"
        STRIP_BINARIES: "${M2_STRIP_BINARIES:-1}"
        # The apt mirror the image build installs from. Gdansk by default: on
        # 11 September 2026 archive.ubuntu.com served Polish players at a few
        # kilobytes a second and every first build "hung" at deps 7/7 for
        # twenty minutes; the mirror cut it to two. An empty M2_APT_MIRROR in
        # .env takes this default too, so an install made before it needs no
        # edit. Set M2_APT_MIRROR to another mirror for another country.
        APT_MIRROR: "${M2_APT_MIRROR:-http://ubuntu.task.gda.pl/ubuntu/}"
    image: metin2/game:mt2009
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-game"
    restart: unless-stopped
    stop_grace_period: 90s
    init: true

    depends_on:
      mariadb:
        condition: service_healthy
      playerbot-migrate:
        condition: service_completed_successfully

    environment:
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      M2_PUBLIC_ADDRESS: "${M2_PUBLIC_ADDRESS:-}"
      M2_BIND_IP: "${M2_BIND_IP:-0.0.0.0}"
      M2_CHANNELS: "${M2_CHANNELS:-1}"
      M2_MAX_LEVEL: "${M2_MAX_LEVEL:-120}"
      M2_TEST_SERVER: "${M2_TEST_SERVER:-0}"
      M2_MALL_URL: "${M2_MALL_URL:-${M2_PUBLIC_ADDRESS:-127.0.0.1}:${M2_ITEMSHOP_PUBLIC_PORT:-7791}}"
      # Where a GM's "Podglad" (the player window's preview) opens <url>players/<pid>:
      # the classic panel's character card, which the package pointed at its
      # author's own panel.mt2009.pl (playerbotify.py, apply_gm_panel_url).
      M2_GM_PANEL_URL: "${M2_GM_PANEL_URL:-http://127.0.0.1:${M2_PANEL_PUBLIC_PORT:-7788}/}"
      M2_LOG_KEEP_DAYS: "${M2_LOG_KEEP_DAYS:-3}"
      M2_TABLE_POSTFIX: "${M2_TABLE_POSTFIX:-}"
      M2_ADMINPAGE_PASSWORD: "${M2_ADMINPAGE_PASSWORD:-}"
      M2_CORE_DUMPS: "${M2_CORE_DUMPS:-0}"
      PLAYERBOT_AUTOSPAWN_COUNT: "${PLAYERBOT_AUTOSPAWN_COUNT:-350}"
      PLAYERBOT_MEDAL_DROPPERS: "${PLAYERBOT_MEDAL_DROPPERS:-0}"
      PLAYERBOT_MEDAL_DROPPER_LEVEL: "${PLAYERBOT_MEDAL_DROPPER_LEVEL:-25}"
      # The spawn plan (input_db.cpp): the cohort's window in minutes, and a
      # second cohort joining one at a time over hours.
      PLAYERBOT_SPAWN_WINDOW_MINUTES: "${PLAYERBOT_SPAWN_WINDOW_MINUTES:-1}"
      PLAYERBOT_LATE_JOINERS: "${PLAYERBOT_LATE_JOINERS:-0}"
      PLAYERBOT_LATE_JOIN_HOURS: "${PLAYERBOT_LATE_JOIN_HOURS:-24}"
      # The operator's own number per kingdom instead of a share of
      # PLAYERBOT_AUTOSPAWN_COUNT (the launcher's "Indywidualne wartosci dla
      # krolestw"); read by the bootstrap in input_db.cpp.
      PLAYERBOT_AUTOSPAWN_PER_KINGDOM: "${PLAYERBOT_AUTOSPAWN_PER_KINGDOM:-0}"
      PLAYERBOT_AUTOSPAWN_SHINSOO: "${PLAYERBOT_AUTOSPAWN_SHINSOO:-0}"
      PLAYERBOT_AUTOSPAWN_CHUNJO: "${PLAYERBOT_AUTOSPAWN_CHUNJO:-0}"
      PLAYERBOT_AUTOSPAWN_JINNO: "${PLAYERBOT_AUTOSPAWN_JINNO:-0}"
      # The second channel: the entrypoint decides it once for every core,
      # from here or from the web panel's wish (whichever is newer), raises
      # M2_CHANNELS to 2 and puts PLAYERBOT_CH2_SHARE percent of the bots on
      # it; shops stay on the first. The range tells it whether players can
      # reach the second channel's ports.
      M2_PLAYERBOT_CH2: "${M2_PLAYERBOT_CH2:-0}"
      PLAYERBOT_CH2_SHARE: "${PLAYERBOT_CH2_SHARE:-40}"
      M2_PLAYERBOT_CH2_SET_AT: "${M2_PLAYERBOT_CH2_SET_AT:-0}"
      M2_GAME_CONTAINER_PORT_RANGE: "${M2_GAME_CONTAINER_PORT_RANGE:-13000-13002}"
      # m2-render-config writes these into CONFIG. Without a line here the
      # value in .env never reaches the container and the defaults stand, which
      # is what every 2.x world had until 2.0.52 (the 1.x compose passes them).
      M2_MOONLIGHT_CHEST_PERMILLE: "${M2_MOONLIGHT_CHEST_PERMILLE:-10}"
      M2_MOONLIGHT_CHEST_STONE_PERMILLE: "${M2_MOONLIGHT_CHEST_STONE_PERMILLE:-300}"
      M2_DRAGON_COIN_STONE_PERMILLE: "${M2_DRAGON_COIN_STONE_PERMILLE:-3}"
      M2_DRAGON_COIN_BOSS_PERMILLE: "${M2_DRAGON_COIN_BOSS_PERMILLE:-50}"
      # A Blessing Scroll from a Metin stone of level 15-99, in thousandths.
      M2_BLESSING_SCROLL_STONE_PERMILLE: "${M2_BLESSING_SCROLL_STONE_PERMILLE:-10}"
      # 0 keeps Shinsoo and Jinno from being started even when the seed once
      # registered them (the migrate service reads the same switch for the
      # seed itself).
      M2_PLAYERBOT_KINGDOMS: "${M2_PLAYERBOT_KINGDOMS:-1}"
      # split (default): per-kingdom cores; Shinsoo/Jinno cap ~36 because the
      # shared frontier lives only on game1. unified: all three kingdoms and the
      # frontier on game1, so every bot reaches 1..104 (m2-render-config reads
      # this). One core carries every bot then - keep the population modest.
      M2_PLAYERBOT_WORLD_LAYOUT: "${M2_PLAYERBOT_WORLD_LAYOUT:-unified}"
      # Only said in the start log here; the migrate service is what acts on it.
      M2_DIFFICULTY: "${M2_DIFFICULTY:-easy}"
      TZ: "${M2_TZ:-UTC}"

    ports:
      - "${M2_HOST_BIND_ADDRESS:-0.0.0.0}:${M2_AUTH_PORT:-11000}:11000/tcp"
      # The container side is a variable too: the launcher widens both to
      # 13000-13012 when it switches the second channel on (M2_PLAYERBOT_CH2),
      # and a world without it publishes the first channel's three as before.
      - "${M2_HOST_BIND_ADDRESS:-0.0.0.0}:${M2_GAME_PORT_RANGE:-13000-13002}:${M2_GAME_CONTAINER_PORT_RANGE:-13000-13002}/tcp"
      # never published: 12000, 14000-14002 (p2p), 15000 (the db core).

    volumes:
      - game-var:/opt/metin2/var
      - rates-spool:/opt/m2spool

    ulimits:
      nofile:
        soft: 16384
        hard: 16384

    networks: [backend]

  # ==== services shared with linux-port (rendered by port/composify.py) ====
  panel:
    build:
      context: ../../linux-port/docker/panel
      dockerfile: Dockerfile
    image: metin2/panel:latest
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-panel"
    restart: unless-stopped

    depends_on:
      mariadb:
        condition: service_healthy
      playerbot-migrate:
        condition: service_completed_successfully

    environment:
      M2_DB_HOST: mariadb
      M2_DB_PORT: "3306"
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"

      # Blank on first run means "generate one and print it once".
      M2_PANEL_PASSWORD: "${M2_PANEL_PASSWORD:-}"
      M2_PANEL_PORT: "7788"
      M2PANEL_ENGINE: mt2009
      # The address the panel is published on, and the explicit answer to
      # "may anybody else reach it": empty lets the panel decide from the
      # address (loopback = local, no passphrase), 0 or 1 overrides that.
      M2PANEL_BIND_ADDRESS: "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}"
      M2PANEL_LOCAL_ONLY: "${M2_PANEL_LOCAL_ONLY:-}"
      M2_PANEL_BIND: "0.0.0.0"

      # So the panel can answer "is the game up" by probing the game container
      # rather than by reading its own socket table, which in a container shows
      # nothing about the game at all.
      M2_GAME_HOST: game
      M2_PANEL_STATUS_PORTS: "${M2_PANEL_STATUS_PORTS:-11000,13000}"

      M2_BRAND: "${M2_BRAND:-}"
      M2_CLIENT_NAME: "${M2_CLIENT_NAME:-}"
      M2_CLIENT_URL: "${M2_CLIENT_URL:-}"
      # 180, not 45: r40250 gives a character four inventory pages. At 45 the
      # panel only looks at the first page and refuses to give an item to
      # anyone whose first page is full.
      M2_INVENTORY_SLOTS: "${M2_INVENTORY_SLOTS:-180}"
      # player.item.count is TINYINT UNSIGNED. Without this the panel allows
      # 65535 and MySQL truncates in silence -- 1000 potions become 255.
      M2_MAX_ITEM_COUNT: "${M2_MAX_ITEM_COUNT:-255}"
      # The same MAX_LEVEL the game core is given, so the panel offers what the
      # server will actually accept. It matters because the server does not say
      # no: a level above gPlayerMaxLevel makes PointChange return without a
      # word, and everything upstream reports success. Passed as M2PANEL_* on
      # purpose -- the panel reads the environment before its config file, so
      # this reaches an install whose m2panel.conf was written long ago.
      M2PANEL_MAX_LEVEL: "${M2_MAX_LEVEL:-120}"
      # 1 when this server is reachable only from the machine it runs on -- the
      # Windows installer sets it, and so does install.sh --local. The panel
      # then tells the operator that nobody else can join, instead of telling
      # them to hand the address out. It cannot be inferred from the bind
      # address: a public server behind nginx also binds the panel to 127.0.0.1.
      M2_LOCAL_ONLY: "${M2_LOCAL_ONLY:-0}"
      # Where players write when something needs adjusting. Empty means the
      # front page leaves the line out entirely -- better than pointing your
      # players at whatever address happened to be in the source.
      M2_CONTACT_EMAIL: "${M2_CONTACT_EMAIL:-}"

      # ---- the client that runs in a browser ------------------------------
      # Off. With it off the panel offers nothing, serves nothing under /play
      # and never contacts the bridge, which is what a server without a browser
      # client wants. Even set to 1 the button appears only once a browser
      # client has actually been placed on the panel's data volume, because
      # until then there would be nothing behind it.
      M2PANEL_BROWSER_PLAY: "${M2_BROWSER_PLAY:-0}"
      # Where the built browser client is, on the panel's own volume.
      M2PANEL_BROWSER_DIR: "/usr/local/m2panel/browser"
      # The bridge's own port on the host, for the case where there is no proxy
      # in front: the panel then tells the page to dial this machine there.
      # Behind nginx the page is told the panel's own address and port instead,
      # because nginx routes /to/ and /ping through -- the client cannot be
      # given a path, only host:port, so same-origin is the only way it gets a
      # certificate. See admin_panel.py, bridge_endpoint().
      M2PANEL_BRIDGE_PORT: "${M2_BRIDGE_PORT:-7789}"
      # Where the panel itself asks the bridge which ports it will connect to,
      # over this network. Not what the browser is told -- see above.
      M2PANEL_BRIDGE_HOST: "wsbridge"
      # Whether nginx is in front, which the panel cannot find out for itself:
      # Docker's port forwarder rewrites the source address, so a proxied
      # request does not arrive from the loopback address it was sent to. The
      # installer sets this when it configures nginx -- and in that arrangement
      # it publishes the panel's port on 127.0.0.1 alone, so the X-Forwarded-*
      # headers this makes the panel believe cannot reach it from anywhere
      # else. Without a domain there is no nginx and this stays 0.
      M2PANEL_TRUST_PROXY: "${M2_TRUST_PROXY:-0}"
      # How much game data the page keeps in memory, in MB. The thing that
      # decides whether the game stutters -- see admin_panel.py, where the
      # number is explained. 0 leaves the page's own default (96) alone.
      M2PANEL_BROWSER_CACHE_MB: "${M2_BROWSER_CACHE_MB:-768}"

      # Server rates. The panel runs M2PANEL_RATES_SCRIPT when somebody saves
      # the rates page and reads M2PANEL_RATES_STATUS back to report how it
      # went -- the same two settings it uses on FreeBSD, pointed at the
      # container versions. The script here only writes a request into the
      # spool the game container is watching; see panel/bin/apply_rates.sh.
      #
      # The script deliberately does NOT live on the panel-data volume: an
      # existing stack keeps its volume across an upgrade, so a file shipped
      # there in a new image would never appear.
      M2PANEL_RATES_SCRIPT: "/usr/local/bin/apply_rates.sh"
      M2PANEL_RATES_STATUS: "/opt/m2spool/rates.status"
      M2PANEL_RATES_SPOOL: "/opt/m2spool"

      # Game master ranks travel over the same spool: the panel writes the row
      # into common.gmlist itself and then drops a note here, and m2-gm in the
      # game container tells the running server to re-read the list. The panel
      # is kept away from that socket on purpose -- it also accepts SHUTDOWN.
      M2PANEL_GM_SPOOL: "/opt/m2spool"

      # And the language the game speaks. The panel asks; m2-lang in the game
      # container swaps the four files and restarts the cores, because they read
      # them only while they boot. lang.status is how the panel knows which
      # language is live -- including on the download page, where it is the one
      # thing a player cannot find out before downloading a gigabyte.
      M2PANEL_LANG_SPOOL: "/opt/m2spool"

      # Once a day the panel asks the project's repository what the newest
      # published version is, and says so in the admin area when it is behind.
      # This is the ONLY part of this stack that contacts the internet by
      # itself. Set M2_UPDATE_CHECK=0 and it contacts nothing at all; nothing
      # else about the panel changes. The panel's own patch-log page explains
      # this in the operator's language, including what GitHub gets to see.
      M2PANEL_UPDATE_CHECK: "${M2_UPDATE_CHECK:-1}"

      # Whether the panel may offer a button that installs an update. Off, and
      # meant to stay off on anything with a public address: see UPDATING.md.
      # Even set to 1 it does nothing on its own -- the work is done by the
      # `updater' service below, which is in a profile and is not started by
      # `docker compose up -d'.
      M2PANEL_UPDATE_APPLY: "${M2_UPDATE_APPLY:-0}"
      M2PANEL_UPDATE_SPOOL: "/opt/m2update"
      # The one command that updates THIS install, shown on the update page.
      # The installers know it -- they know the URL they were fetched from and
      # the options they were given -- so they write it here and the panel just
      # repeats it. Empty falls back to the by-hand sequence, which is right for
      # a stack somebody assembled themselves. On Windows this is the entire
      # update mechanism: the installer is idempotent, so running it again is
      # the update, and nothing has to sit in the background waiting to do it.
      M2PANEL_UPDATE_COMMAND: "${M2_UPDATE_COMMAND:-}"

      TZ: "${M2_TZ:-UTC}"

    ports:
      # Keep the host address separate from the numeric port.  Older installers
      # encoded "127.0.0.1:7788" in M2_PANEL_PUBLIC_PORT; once the common host
      # bind variable was introduced that produced an invalid two-address
      # mapping such as "0.0.0.0:127.0.0.1:7788:7788".
      # Falling back to M2_HOST_BIND_ADDRESS keeps older local .env files
      # loopback-only until their next installer/update run adds the new key.
      - "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_PANEL_PUBLIC_PORT:-7788}:7788/tcp"

    volumes:
      # m2panel.conf: the admin password hash, per-install salt and Flask
      # session secret. Generated on first run and then never regenerated --
      # losing it logs everyone out and forgets the password.
      - panel-conf:/usr/local/etc
      # client.zip (the game client offered to players) and downloads.db (the
      # per-IP download quota). client.zip is ~1.2 GB and is uploaded by the
      # operator, not shipped in the image.
      - panel-data:/usr/local/m2panel
      # Read-only access to server logs for live bot inspection
      - game-var:/opt/metin2/var:ro
      # The other end of the rate spool. Same volume, same path as in the game
      # container, so a request written here is the file read over there.
      - rates-spool:/opt/m2spool

      # The same arrangement again for updates: the panel leaves a request in
      # here, the updater (below, and only when the operator starts it) reads
      # it and writes back how it is going. A directory, not the Docker socket
      # -- the panel is the internet-facing process in this stack and the
      # socket is root on the host.
      - update-spool:/opt/m2update

    networks: [backend]

  # ---------------------------------------------------------------------------
  # The game client players download.
  #
  # A one-shot tool, not a service. It has a profile, so `docker compose up'
  # never starts it; it is run on purpose:
  #
  #     docker compose run --rm client-builder
  #
  # It fetches the server-file archive (a MEGA share link, over a gigabyte),
  # writes M2_PUBLIC_ADDRESS into the client inside it, and puts the result on
  # the panel's data volume, which is what makes the panel's "Download the game"
  # button work.
  #
  # It is safe to run again. The download and the built client stay in their own
  # cache volume, so changing the address afterwards rewrites one file inside an
  # existing zip and copies it across -- seconds, and nothing is downloaded.
  # ---------------------------------------------------------------------------
  seban-panel:
    build:
      context: ../../linux-port/docker/seban-panel
      dockerfile: Dockerfile
    image: metin2/seban-panel:latest
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-panel"
    restart: unless-stopped
    depends_on:
      - mariadb
    environment: &seban-env
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: "${M2_DB_USER:-metin2}"
      DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      PLAYERBOTS_GAME_HOST: game
      PLAYERBOTS_ENGINE: mt2009
      PLAYERBOTS_LOGIN_PORT: "11000"
      PLAYERBOTS_WORLD_PORT: "13000"
      PLAYERBOTS_STATUS_GLOB: "/opt/metin2/var/channel*/*/playerbot_status.tsv"
      # Opened by the visitor's browser, so the address the classic panel is
      # reachable at from outside - not a container name.
      TIERU_PANEL_URL: "${M2_SEBAN_TIERU_PANEL_URL:-http://127.0.0.1:${M2_PANEL_PUBLIC_PORT:-7788}}"
      # Its own secret when .env has one; otherwise the admin-page secret
      # every .env already carries, so no install runs on the upstream default.
      SEBAN_SESSION_SECRET: "${M2_SEBAN_SESSION_SECRET:-${M2_ADMINPAGE_PASSWORD:-change-this-before-public-use}}"
      SEBAN_COLLECTOR_INTERVAL: "${M2_SEBAN_COLLECTOR_INTERVAL:-300}"
      # Which Playerbots release this world is running. Read from the same
      # VERSION file the launcher writes, so the panel's dashboard reports the
      # server it is actually looking at rather than "nieustawiona".
      # The default is bumped with every release, so a world nobody has
      # configured still reports the version it is actually running.
      PLAYERBOTS_VERSION: "${M2_PLAYERBOTS_VERSION:-2.2.15}"
      TZ: "${M2_TZ:-UTC}"
    ports:
      # 7790 outside: 7789 is the browser bridge's port in this stack.
      - "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_SEBAN_PANEL_PORT:-7790}:7789/tcp"
    volumes:
      - game-var:/opt/metin2/var:ro
      - rates-spool:/opt/m2spool
      # The updater's spool, the same one the classic panel and the updater
      # service share: 1.38 of this panel carries an update button that
      # writes a request there and reads the updater's status back. Without
      # the mount the button can only say "the updater is not running".
      - update-spool:/opt/m2update
    networks: [backend]

  # The ItemShop (OskarPWA): a PHP shop for Dragon Coins (account.cash) and
  # Dragon Marks (account.mileage), opened from the coin on the game's
  # taskbar in the client's built-in browser. A purchase writes
  # player.item_award; the db core delivers it at the player's next login.
  # Its own tables live in the itemshop database, created and seeded by
  # playerbot-migrate (mariadb/playerbot/itemshop_schema.sql).
  itemshop:
    build:
      context: ../../linux-port/docker/itemshop
      dockerfile: Dockerfile
    image: metin2/itemshop:latest
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-itemshop"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      M2_DB_HOST: mariadb
      M2_DB_USER: "${M2_DB_USER:-metin2}"
      M2_DB_PASSWORD: "${M2_DB_PASSWORD:?set M2_DB_PASSWORD in .env}"
      # The r40250 core signs the shop link with "GF9001"; only a core built
      # with another key needs this changed.
      M2_MALL_SAS_KEY: "${M2_MALL_SAS_KEY:-GF9001}"
      TZ: "${M2_TZ:-UTC}"
    ports:
      - "${M2_PANEL_BIND_ADDRESS:-${M2_HOST_BIND_ADDRESS:-0.0.0.0}}:${M2_ITEMSHOP_PUBLIC_PORT:-7791}:80/tcp"
    networks: [backend]

  # The panel's two helpers run the image the seban-panel service builds.
  # An older Compose does not know that and tries to pull it from Docker
  # Hub first - "pull access denied for metin2/seban-panel" - which ended
  # a start with no such image yet in code 1 (DUDU on a VPS, archonek
  # updating on Windows, 18 September; Compose 5.5 here never pulls it).
  # Never pulled: the build in the same `up` makes it before they start.
  seban-collector:
    image: metin2/seban-panel:latest
    pull_policy: never
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-collector"
    restart: unless-stopped
    command: ["python", "collector.py"]
    depends_on:
      - seban-panel
    environment: *seban-env
    volumes:
      # The host's load, or on Docker Desktop the VM's - what there is.
      - /proc:/host/proc:ro
      - /:/hostfs:ro
      - game-var:/opt/metin2/var:ro
    networks: [backend]

  seban-item-grants:
    image: metin2/seban-panel:latest
    pull_policy: never
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-seban-item-grants"
    restart: unless-stopped
    command: ["python", "item_grants.py"]
    depends_on:
      - seban-panel
    environment: *seban-env
    networks: [backend]

  updater:
    build:
      context: ../../linux-port/docker/updater
      dockerfile: Dockerfile
    image: metin2/updater:latest
    container_name: "${M2_CONTAINER_PREFIX:-metin2}-updater"
    profiles: ["update"]
    restart: unless-stopped
    init: true
    # The 2.x line updates from the package zip the manifest names - the same
    # zip the Windows launcher installs - and not from a git checkout of the
    # repository: the repository's root VERSION is the 1.x line's, and the 1.x
    # updater staged that line over a 2.x server ("checkout z main melduje
    # 1.33.3", rates stuck, no stalls - l0st3k, 12 September).
    # linux-port/tools/update.sh in watch mode reads the request the panel
    # writes and answers in the same update.status the panel reads.
    entrypoint: ["/bin/sh", "${M2_UPDATE_STACK_DIR:-/opt/metin2}/linux-port/tools/update.sh"]
    command: ["watch"]

    environment:
      M2_UPDATE_SPOOL: "/opt/m2update"
      # Where the installed stack is -- the directory holding this file.
      # On this line the "stack dir" is the server folder itself: the one
      # with VERSION, CHANGELOG.md and linux-port/ in it.
      M2_UPDATE_STACK_DIR: "${M2_UPDATE_STACK_DIR:-/opt/metin2}"
      # Where install.sh put the source cache and the git checkout inside it.
      M2_UPDATE_CACHE_DIR: "${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}"
      M2_UPDATE_REPO_DIR: "${M2_UPDATE_REPO_DIR:-/var/cache/m2src/repo}"
      M2_UPDATE_BRANCH: "${M2_UPDATE_BRANCH:-main}"
      TZ: "${M2_TZ:-UTC}"

    volumes:
      # The request/response directory shared with the panel. This is the whole
      # of the interface between them: the panel can leave a file here and can
      # read what this writes back. It cannot reach anything else in here.
      - update-spool:/opt/m2update

      # The host's Docker daemon. This is the dangerous mount in this file, and
      # it is confined to this service on purpose. Read UPDATING.md.
      - /var/run/docker.sock:/var/run/docker.sock

      # Same path inside as outside -- see above.
      - "${M2_UPDATE_STACK_DIR:-/opt/metin2}:${M2_UPDATE_STACK_DIR:-/opt/metin2}"
      - "${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}:${M2_UPDATE_CACHE_DIR:-/var/cache/m2src}"

    # Not on `backend': it has no business talking to the database or the game,
    # and the only network it needs is the one out to the project's repository.
    # Compose gives it the default network, which is created only when this
    # service is actually started.

# =============================================================================

  # ==== end of the shared services ====

volumes:
  db-data:
  update-spool:
  panel-data:
  panel-conf:
  game-var:
  rates-spool:

networks:
  backend:
    driver: bridge
